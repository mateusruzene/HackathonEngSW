services:
  hackathon-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hackathon_ufpr_app
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/hackathon.sqlite
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
